[package]
name = "frontrise"
version = "0.3.4"
edition = "2021"
description = "Animated video and shader wallpapers for GNOME"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gio = { version = "0.22", features = ["v2_80"] }
glib = "0.22"
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
fastrand = "2"
glow = "0.16"
libloading = "0.9"

[profile.release]
lto = "thin"
